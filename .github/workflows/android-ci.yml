name: Android CI

on:
  push:
    branches:
      - rerr
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 单元测试、Lint 与构建
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      - name: 授予 Gradle Wrapper 执行权限
        run: chmod +x gradlew

      - name: 执行完整验证
        run: ./gradlew --no-daemon --continue testDebugUnitTest lintDebug assembleDebug

      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-ci-reports-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传 Debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
