name: Android CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit_test:
    name: 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      - name: 授予 Gradle Wrapper 执行权限
        run: chmod +x gradlew

      - name: 执行单元测试
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: 上传测试失败报告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      - name: 授予 Gradle Wrapper 执行权限
        run: chmod +x gradlew

      - name: 执行 Lint
        run: ./gradlew --no-daemon lintDebug

      - name: 上传 Lint 失败报告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports-${{ github.run_id }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 7

  assemble:
    name: Debug 构建
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      - name: 授予 Gradle Wrapper 执行权限
        run: chmod +x gradlew

      - name: 执行 Debug 构建
        run: ./gradlew --no-daemon assembleDebug

      - name: 上传 Debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  verify:
    name: 单元测试、Lint 与构建
    if: always()
    needs:
      - unit_test
      - lint
      - assemble
    runs-on: ubuntu-latest

    steps:
      - name: 汇总并行任务结果
        env:
          UNIT_TEST_RESULT: ${{ needs.unit_test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          ASSEMBLE_RESULT: ${{ needs.assemble.result }}
        run: |
          test "$UNIT_TEST_RESULT" = "success"
          test "$LINT_RESULT" = "success"
          test "$ASSEMBLE_RESULT" = "success"
